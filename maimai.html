<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>舞萌DX 维护通知</title>
    <style>
        /* 美化通知样式，模拟正式公告排版 */
        .notice-container {
            width: 600px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background-color: #fafafa;
            font-family: "微软雅黑", "宋体", sans-serif;
            line-height: 2;
            font-size: 16px;
            color: #333;
        }
        .notice-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #222;
        }
        .notice-footer {
            margin-top: 30px;
            text-align: right;
            color: #555;
        }
    </style>
</head>
<body>
    <!-- 维护通知展示容器 -->
    <div class="notice-container">
        <div class="notice-title">舞萌DX 紧急维护通知</div>
        <div id="notice-content"></div>
    </div>

    <script>
        // 1. 工具函数：补零（确保月份、日期为两位数，对应Python的strftime格式化效果）
        function addZero(num) {
            return num < 10 ? "0" + num : num;
        }

        // 2. 获取今日日期和明日日期（对应Python的datetime和timedelta）
        const todayDate = new Date();
        const tomorrowDate = new Date(todayDate);
        tomorrowDate.setDate(tomorrowDate.getDate() + 1); // 日期+1，即明日

        // 格式化今日日期：YYYY年MM月DD日
        const today = `${todayDate.getFullYear()}年${addZero(todayDate.getMonth() + 1)}月${addZero(todayDate.getDate())}日`;
        // 格式化明日日期：MM月DD日（注意：JavaScript月份从0开始，需+1）
        const tomorrow = `${addZero(tomorrowDate.getMonth() + 1)}月${addZero(tomorrowDate.getDate())}日`;

        // 3. 拼接维护通知文本（对应Python的f-string模板）
        const notice = `亲爱的玩家们:

本次舞萌DX紧急维护的时间，将延长至${tomorrow}，在此期间内将停止线上服务。

原定${tomorrow}的乐曲更新也将延期。

关于以上的开服和更新时间，我们将会在确定后另行公布。

对此给各位带来的不便，我们深表歉意，敬请谅解!

<div class="notice-footer">
世嘉飞舞<br>
《舞萌DX》项目组<br>
${today}
</div>`;

        // 4. 展示通知内容（对应Python的print(notice)）
        document.getElementById("notice-content").innerHTML = notice;

        // 可选：同时在浏览器控制台打印一份（和Python print效果一致，F12可查看）
        console.log(notice.replace(/<br>/g, "\n").replace(/<div class="notice-footer">|<\/div>/g, ""));
    </script>
</body>
</html>
